name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir project
          unzip -q tuition-tracker.zip -d project

      - name: Find Gradle project
        id: find_project
        run: |
          GRADLEW=$(find project -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found"
            exit 1
          fi
          ROOT=$(dirname "$GRADLEW")
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Make Gradle executable
        run: chmod +x "${{ steps.find_project.outputs.root }}/gradlew"

      - name: Build Debug APK
        run: |
          cd "${{ steps.find_project.outputs.root }}"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tuition-tracker-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
